name: Coleta do Bolsa Família por município (lenta, em fatias)

# Único estágio da pipeline que precisa de uma chave de API pessoal (Portal da
# Transparência). Roda à parte dos demais workflows porque consulta um município por
# vez — ~5.571 chamadas — e precisa respeitar o limite de uso da chave.
#
# Fica em fatias pequenas e pausadas (ver scripts/coletar_transparencia_fatias.py) e
# commita o progresso a cada fatia, para nunca perder o que já foi coletado: se o job
# estourar o tempo limite do runner ou a API sinalizar limite de uso, é só disparar o
# workflow de novo — ele retoma de onde parou. Ao concluir os 5.571 municípios, grava
# também o agregado por UF (data/processed/bolsa_familia_por_uf_<mes>.csv) usado por
# scripts/analisar_pergunta_central.py.
#
# Requer o secret PORTAL_TRANSPARENCIA_TOKEN configurado no repositório (Settings →
# Secrets and variables → Actions → New repository secret). Ver README, seção "Dados
# versionados por exceção".
#
# Para validar a pipeline sem tocar nos dados reais: preencha o input "ufs" (ex.: AP,RR)
# ao disparar o workflow — a coleta fica restrita a essas UFs e grava em teste_de_2_ufs/
# em vez de data/. Deixe "ufs" em branco para a coleta completa de verdade.

on:
  workflow_dispatch:
    inputs:
      mes:
        description: "Mês de referência (AAAAMM)"
        default: "202512"
      fatia:
        description: "Municípios por fatia"
        default: "150"
      pausa_fatias:
        description: "Pausa entre fatias, em segundos"
        default: "180"
      pausa_req:
        description: "Pausa entre requisições, em segundos"
        default: "1.5"
      ufs:
        description: >-
          UFs para coleta PARCIAL, separadas por vírgula (ex.: AP,RR) — valida a
          pipeline rápido, sem tocar nos dados reais. Resultado vai para
          teste_de_2_ufs/, não para data/. Deixe em branco para a coleta completa
          (as 27 UFs, salva em data/, como de costume).
        default: ""

permissions:
  contents: write

concurrency:
  group: coleta-bolsa-familia
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    # Limite do runner hospedado é 360 min (6h); fica com folga para o setup e para o
    # job encerrar de forma limpa antes do corte forçado.
    timeout-minutes: 345

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Configurar identidade do git (commits de progresso)
        # Atribui os commits a quem disparou o workflow, não a um bot genérico — sem
        # precisar de secret nem de conta configurada à parte, o GitHub já expõe isso
        # no contexto. O e-mail usa o formato noreply atual do GitHub (ID+usuário);
        # "usuário@users.noreply.github.com", sem o ID, só é reconhecido em contas bem
        # antigas (anteriores a ~2017) — nas demais, o commit funciona do mesmo jeito,
        # mas não fica linkado ao perfil/avatar de quem disparou.
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Coletar em fatias até concluir, commitando o progresso a cada fatia
        env:
          PORTAL_TRANSPARENCIA_TOKEN: ${{ secrets.PORTAL_TRANSPARENCIA_TOKEN }}
          MES: ${{ inputs.mes }}
          FATIA: ${{ inputs.fatia }}
          PAUSA_FATIAS: ${{ inputs.pausa_fatias }}
          PAUSA_REQ: ${{ inputs.pausa_req }}
          UFS: ${{ inputs.ufs }}
        run: |
          set -u
          if [ -z "${PORTAL_TRANSPARENCIA_TOKEN:-}" ]; then
            echo "::error::Secret PORTAL_TRANSPARENCIA_TOKEN não configurado (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          EXTRA_ARGS=()
          if [ -n "$UFS" ]; then
            echo "::notice::Modo teste — coleta restrita a: $UFS. Resultado vai para teste_de_2_ufs/, não para data/."
            CAMINHO_BRUTO="teste_de_2_ufs/teste_bolsa_familia.csv"
            CAMINHO_AGREGADO="teste_de_2_ufs/teste_bolsa_familia_por_uf.csv"
            EXTRA_ARGS=(--ufs "$UFS" --saida "$CAMINHO_BRUTO" --saida-agregado "$CAMINHO_AGREGADO")
            CAMINHOS_GIT=(teste_de_2_ufs)
          else
            CAMINHOS_GIT=(data/raw/transparencia data/processed)
          fi

          commitar_progresso() {
            if [ -n "$(git status --porcelain -- "${CAMINHOS_GIT[@]}" 2>/dev/null)" ]; then
              git add -A -- "${CAMINHOS_GIT[@]}"
              git commit -q -m "Progresso da coleta do Bolsa Família ($MES)${UFS:+ [teste: $UFS]}"
              git push -q
              echo "  progresso commitado."
            fi
          }

          falhas=0
          while true; do
            saida=$(python scripts/coletar_transparencia_fatias.py --mes "$MES" --fatia "$FATIA" --pausa "$PAUSA_REQ" "${EXTRA_ARGS[@]}" 2>&1)
            rc=$?
            echo "$saida"
            commitar_progresso

            if echo "$saida" | grep -q "limite de uso"; then
              echo "::warning::API sinalizou limite de uso — parando. Dispare o workflow de novo mais tarde para continuar."
              exit 0
            fi
            if echo "$saida" | grep -q "Coleta completa"; then
              echo "Coleta concluída e commitada — pronta para scripts/analisar_pergunta_central.py."
              exit 0
            fi
            if [ $rc -ne 0 ]; then
              falhas=$((falhas + 1))
              if [ $falhas -ge 3 ]; then
                echo "::error::3 falhas seguidas — parando. Dispare o workflow de novo para continuar de onde parou."
                exit 1
              fi
              echo "  falha $falhas/3 — aguardando 5 min e tentando de novo."
              sleep 300
              continue
            fi
            falhas=0
            sleep "$PAUSA_FATIAS"
          done
